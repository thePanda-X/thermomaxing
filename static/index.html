<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermomaxing | Recipe Importer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="background-glow"></div>
    <div class="container">
        <header>
            <h1>Thermomaxing</h1>
            <p class="subtitle">Import recipes to Cookidoo with AI magic</p>
        </header>

        <main>
            <div class="card glass-panel">
                <div class="input-group">
                    <input type="text" id="recipe-url" placeholder="Paste recipe URL here..." autocomplete="off">
                    <button id="import-btn" onclick="startImport()">
                        <span class="btn-text">Import</span>
                        <div class="loader"></div>
                    </button>
                </div>
                
                <div id="progress-container" class="status-container hidden">
                    <div class="status-header">
                        <h3>Import Progress</h3>
                    </div>
                    <ul id="steps-list" class="steps-list"></ul>
                </div>
            </div>

            <div id="success-overlay" class="overlay hidden">
                <div class="overlay-content glass-panel">
                    <div class="success-icon">
                        <i data-lucide="check-circle" width="48" height="48"></i>
                    </div>
                    <h2>Import Successful!</h2>
                    <p>Your recipe is now available in Cookidoo.</p>
                    <button onclick="resetUI()">Import Another</button>
                </div>
            </div>

            <div id="error-overlay" class="overlay hidden">
                <div class="overlay-content glass-panel">
                    <div class="error-icon">
                        <i data-lucide="alert-circle" width="48" height="48"></i>
                    </div>
                    <h2>Import Failed</h2>
                    <p id="error-modal-message">Something went wrong.</p>
                    <button onclick="resetUI()">Try Again</button>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
